name: Build and Push Docker image to ECR

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  push_image:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Debug OIDC Token
        run: |
          IDTOKEN=$(curl -sLS -H "User-Agent: actions/bash" -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')
          echo "JWT Payload:"
          jq -R 'split(".") | .[1] | @base64d | fromjson' <<< "$IDTOKEN"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::914337380547:role/GitHubActionsECRRole
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Test list repositories
        run: |
          aws ecr describe-repositories --output table
          