version: "3.9"

services:

  frontend:
    build:
      context: ./frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend

  backend:
    build:
      context: ./posting
    ports:
      - "8082:8082"
    depends_on:
      - db
    volumes:
      - uploads_data:/app/uploads
    env_file:
      - .env

  db:
    build:
      context: ./database
    container_name: postgres
    ports:
      - "5432:5432"
    env_file:
      - .env

  email-service:
    build:
      context: ./mailing/mail-service
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8080:8080"

  password-service:
    build:
      context: ./dailyfunctions
      dockerfile: Dockerfile
    depends_on:
      - db
      - email-service
    environment:
      - EMAIL_SERVICE_URL=http://email-service:8088/sent-mail
    env_file:
      - .env

volumes:
  uploads_data: