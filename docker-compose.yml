version: "3.9"

services:

  frontend:
    build:
      context: ./frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend

  backend:
    build:
      context: ./posting
    ports:
      - "8080:8080"
    depends_on:
      - db
    env_file:
      - .env

  db:
    build:
      context: ./database
    container_name: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    env_file:
      - .env

volumes:
  db_data: