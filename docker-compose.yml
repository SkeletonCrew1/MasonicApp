version: "3.9"

version: "3.9"

services:

  postgres:
    networks:
      - backend
    build:
      context: ./database
    container_name: postgres
    ports:
      - "5432:5432"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend

    networks:
      - frontend

    ports:
      - "3000:3000"

    depends_on:
      - posting

  backend-django:
    build:
      context: ./backend-django
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - backend
    volumes:
      - ./backend-django:/app

  posting:
    networks:
      - backend
    build:
      context: ./posting
    ports:
      - "8085:8085"
    depends_on:
      - postgres
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  uploads_data:
  data_sql:

networks:
  backend:
    driver: bridge
    name: backend_net
  frontend:
    driver: bridge
    name: frontend_net