version: "3.9"

services:

  frontend:
    build:
      context: ./frontend

    networks:
      - frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend

  backend:
    networks:
      - backend
    build:
      context: ./posting
    ports:
      - "8082:8082"
    depends_on:
      - db
    volumes:
      - uploads_data:/app/uploads
    env_file:
      - .env

  db:
    networks:
      - backend
    build:
      context: ./database
    container_name: postgres
    ports:
      - "5432:5432"
    env_file:
      - .env

