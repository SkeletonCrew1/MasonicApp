services:
  main-db:
    image: postgres:18
    container_name: main-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${MAIN_DB_NAME}
    ports:
      - "5432:5432"
    networks:
      - backend 
    volumes:
      - main_data_sql:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file: .env
  main-flyway:
    image: flyway/flyway:latest
    entrypoint: ["flyway", "-url=jdbc:${MAIN_DATABASE_URL}", "-user=${POSTGRES_USER}", "-password=${POSTGRES_PASSWORD}", "-baselineOnMigrate=true", "-validateMigrationNaming=true", "migrate"] 
    volumes:
      - ./db/migrations/main-db:/flyway/sql
    depends_on:
      main-db:
        condition: service_healthy
    networks:
      - backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${MAIN_DB_NAME}
      DATABASE_URL: ${MAIN_DATABASE_URL}
    env_file: .env 

  frontend:
    build:
      context: ./frontend
    networks:
      - frontend
    ports:
      - "3000:3000"
    depends_on:
      - posting

  backend-django:
    build:
      context: ./backend-django
    depends_on:
      main-db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - backend
    volumes:
      - ./backend-django:/app

  posting:
    networks:
      - backend
    build:
      context: ./posting
    ports:
      - "8085:8085"
    depends_on:
      - main-db
    volumes:
      - uploads_data:/app/uploads
    env_file:
      - .env

  email-service:
    networks:
      - backend
    build:
      context: ./mail-service
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - main-db


  password-service:
    networks:
      - backend
    build:
      context: ./dailyfunctions
      dockerfile: Dockerfile
    depends_on:
      main-db:
        condition: service_healthy
      email-service:
        condition: service_started
    environment:
      - EMAIL_SERVICE_URL=http://email-service:8080/sent-mail
    env_file:
      - .env

volumes:
  uploads_data:
  main_data_sql:

networks:
  backend:
    driver: bridge
    name: backend_net
  frontend:
    driver: bridge
    name: frontend_net