apiVersion: apps/v1
kind: Deployment
metadata:
  name: posting-deployment
  namespace: {{ .Values.namespace }}
  labels:
    app: masonicapp
    microservice: posting
spec:
  replicas: 1
  selector:
    matchLabels:
      microservice: posting
  template:
    metadata:
      name: masonic-posting
      labels:
        app: masonicapp
        microservice: posting
    spec:
      serviceAccountName: app-service-account
      containers:
      - name: posting-container
        image: {{ .Values.postingImage }}
        env:
          - name: MAP_DB_HOST
            valueFrom:
              secretKeyRef:
                name: app-aws-secrets-map
                key: MAP_DB_HOST
          - name: MAP_DB_PORT
            valueFrom:
              secretKeyRef:
                name: app-aws-secrets-map
                key: MAP_DB_PORT
          - name: MAP_DB_USER
            valueFrom:
              secretKeyRef:
                name: app-aws-secrets-map
                key: MAP_DB_USER
          - name: MAP_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: app-aws-secrets-map
                key: MAP_DB_PASSWORD
          - name: MAP_DB_NAME
            valueFrom:
              secretKeyRef:
                name: app-aws-secrets-map
                key: MAP_DB_NAME
          - name: AWS_REGION
            valueFrom:
              secretKeyRef:
                name: app-aws-secrets-map
                key: AWS_REGION
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: app-aws-secrets-map
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: app-aws-secrets-map
                key: AWS_SECRET_ACCESS_KEY
          - name: S3_BUCKET_NAME
            valueFrom:
              secretKeyRef:
                name: app-aws-secrets-map
                key: S3_BUCKET_NAME
          - name: SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: app-aws-secrets-map
                key: SECRET_KEY
        volumeMounts:
        - name: secrets-volume
          mountPath: "/mnt/secrets"
          readOnly: true
      volumes:
      - name: secrets-volume
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "aws-secrets-all"