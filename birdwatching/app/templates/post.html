<!DOCTYPE html>
<html>
<head>
    <title>Post</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>{{ post.title }}</h2>
    <hr>

    <img src="{{ image_url }}" class="img-fluid rounded mb-3" style="max-width: 300px;">

    {% if not post.hide_location%}
        <p><strong>Location:</strong> {{ post.location }}</p>
    {% else %}
        <p class="text-muted"><i>Location hidden.</i></p>
    {% endif %}

    <p>Posted by: {{ post.author.username }} on {{ post.date_posted.strftime('%Y-%m-%d') }}</p>

    <p>Total Likes: {{ post.likes|length }}</p>
    <a href="{{ url_for('app.like_post', post_id=post.id) }}" class="btn btn-primary btn-sm">Like this post</a>

    <br><br>
    <a href="/">Back to Home</a>
</div>
</body>
</html>
