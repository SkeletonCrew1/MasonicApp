apiVersion: batch/v1
kind: Job 
metadata:
  name: flyway-migrations-job
  namespace: masonic-app
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: flyway-main
          image: paranormal-repo/masonic-migrations:v1
          command: ["flyway"]
          args:
            - "-url=jdbc:postgresql://$(DB_HOST):5432/main_db"
            - "-user=$(POSTGRES_USER)"
            - "-password=$(POSTGRES_PASSWORD)"
            - "-locations=filesystem:/flyway/sql/main"
            - "-baselineOnMigrate=true"
            - "-baselineVersion=0"
            - "-validateMigrationNaming=true"
            - "migrate"
          envFrom:
            - secretRef:
                name: rds-credentials

        # map db 
        - name: flyway-map
          image: paranormal-repo/masonic-migrations:v1
          command: ["flyway"]
          args:
            - "-url=jdbc:postgresql://$(DB_HOST):5432/map_db"
            - "-user=$(POSTGRES_USER)"
            - "-password=$(POSTGRES_PASSWORD)"
            - "-locations=filesystem:/flyway/sql/map"
            - "-baselineOnMigrate=true"
            - "-baselineVersion=0"
            - "-validateMigrationNaming=true"
            - "migrate"
          envFrom: 
            - secretRef:
                name: rds-credentials
          
        # voting db
        - name: flyway-voting
          image: paranormal-repo/masonic-migrations:v1
          command: ["flyway"]
          args:
            - "-url=jdbc:postgresql://$(DB_HOST):5432/voting_db"
            - "-user=$(POSTGRES_USER)"
            - "-password=$(POSTGRES_PASSWORD)"
            - "-locations=filesystem:/flyway/sql/voting"
            - "-baselineOnMigrate=true"
            - "-baselineVersion=0"
            - "-validateMigrationNaming=true"
            - "migrate"
          envFrom:
            - secretRef:
                name: rds-credentials

